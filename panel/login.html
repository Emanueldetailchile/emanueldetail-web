<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acceso · EmanuelDetail</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#29231a,#101010 60%);color:#f7f4ee;font:16px system-ui,sans-serif}.box{width:min(100%,400px);background:#191919;border:1px solid #3b3528;border-radius:18px;padding:28px;box-shadow:0 18px 55px #0006}.logo{color:#d7b46a;font-weight:800;border:1px solid #d7b46a;border-radius:12px;width:48px;height:48px;display:grid;place-items:center;margin-bottom:18px}h1{font-size:24px;margin:0}p{color:#bbb;line-height:1.5;font-size:14px}label{display:block;margin:22px 0 8px;font-size:14px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #555;background:#101010;color:#fff;font:inherit}button{width:100%;padding:13px;margin-top:14px;border:0;border-radius:9px;background:#d7b46a;color:#17130c;font-weight:700;font:inherit;cursor:pointer}#msg{min-height:20px;color:#f1bd8e;font-size:13px}</style></head><body><main class="box"><div class="logo">ED</div><h1>Panel EmanuelDetail</h1><p>Acceso privado. Ingresa la clave administrativa para continuar.</p><form id="f"><label for="pw">Clave de acceso</label><input id="pw" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar al panel</button><p id="msg" role="status"></p></form></main><script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button'),m=document.getElementById('msg');b.disabled=true;m.textContent='Verificando…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});if(r.ok){location.replace('/')}else{m.textContent='No se pudo validar la clave. Revisa e inténtalo de nuevo.'}}catch(_){m.textContent='No se pudo conectar. Inténtalo otra vez.'}finally{b.disabled=false}});
</script></body></html>
